# Build + tooling configuration for awesome-codeswissgov.
# Runtime deps live in requirements.txt; dev deps in requirements-dev.txt.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeswissgov"
version = "0.1.0"
description = "Inventory tooling for Swiss public-sector open source (data/ -> README + inventory.json)."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# Single source of truth for pinned runtime deps.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
# Source package lives under src/ (also installed editable in CI).
pythonpath = ["src"]
testpaths = ["tests"]
